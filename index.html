<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POSTECH 셔틀버스 실시간 지도</title>
<meta name="description" content="POSTECH 셔틀버스 노선·정류장을 지도에서 보고, 내 위치 기준으로 다음 버스까지 남은 시간을 확인합니다.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#A61955">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="POSTECH 셔틀">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
:root{
  --postech-red:#A61955; --postech-red-700:#900048; --postech-red-050:#FCEEF3;
  --ink:#222; --muted:#666A73; --line:#D9DDE3; --soft:#F5F6F8; --paper:#fff; --bg:#F2F3F5;
  --shadow:0 8px 26px rgba(0,0,0,.08);
  --panel-w:390px; --header-h:58px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.6;letter-spacing:-.012em;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}

/* ---------- header ---------- */
.hdr{
  position:fixed;inset:0 0 auto 0;height:var(--header-h);z-index:1000;
  background:#fff;border-top:3px solid var(--postech-red);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;padding:0 12px;
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
}
.brand{min-width:0;overflow:hidden}
.hdr strong{font-size:16.5px;letter-spacing:-.03em;display:block;white-space:nowrap}
.hdr .sub{
  font-size:13px;color:var(--muted);display:block;font-weight:600;margin-top:-2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hdr .spacer{flex:1}
.hdr-btn.primary{background:var(--postech-red);border-color:var(--postech-red);color:#fff}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto}
.lang button{
  border:0;background:#fff;color:#69717d;padding:6px 10px;
  font-size:13px;font-weight:900;line-height:1;
}
.lang button.on{background:var(--postech-red);color:#fff}
.lang button:not(.on):hover{background:var(--soft);color:var(--ink)}
.hdr-btn.primary:hover{background:var(--postech-red-700);color:#fff}
.hdr-btn{
  border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:7px 11px;font-size:14.5px;font-weight:800;color:#444B57;white-space:nowrap;
}
.hdr-btn:hover{background:var(--soft);color:var(--postech-red)}
.hdr-btn.on{background:var(--postech-red);border-color:var(--postech-red);color:#fff}
.clock{
  font-variant-numeric:tabular-nums;font-weight:900;font-size:15.5px;
  padding:6px 10px;border-radius:9px;background:var(--soft);color:#333;
}
.clock.sim{background:#FFF4D6;color:#8a6100}
.clock .colon{animation:blink 1s step-end infinite;animation-delay:var(--blink-delay,0s)}
.clock.sim .colon{animation:none}          /* 옮겨 둔 시각은 지금이 아니다 */
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){
  .clock .colon{animation:none}
}

/* ---------- layout ---------- *
 * 모바일이 기본. 지도는 화면 전체를 채우고 패널이 바텀시트로 그 위에 뜬다.
 * 시트가 가리는 높이를 --sheet 로 알려 주어 지도 버튼과 fitBounds 가 피해 간다.
 */
:root{ --sheet:46dvh; --sheet-max:88dvh; }  /* JS 가 로드되면 px 값으로 덮어쓴다 */

#map{
  position:fixed;left:0;right:0;top:var(--header-h);bottom:0;background:#e8eaed;
}
.panel{
  position:fixed;left:0;right:0;bottom:0;z-index:900;
  height:var(--sheet-max);
  background:#fff;border-radius:20px 20px 0 0;
  box-shadow:0 -6px 28px rgba(0,0,0,.16);
  display:flex;flex-direction:column;
  transform:translateY(calc(var(--sheet-max) - var(--sheet)));
  transition:transform .26s cubic-bezier(.22,.7,.3,1);
  touch-action:none;
}
.panel.dragging{transition:none}
.panel-scroll{
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  flex:1;padding:0 14px calc(28px + env(safe-area-inset-bottom));touch-action:pan-y;
}
/* 시트 손잡이 */
.grab{
  height:22px;display:grid;place-items:center;flex:0 0 auto;cursor:grab;
  touch-action:none;
}
.grab span{width:38px;height:4px;border-radius:99px;background:#D3D7DE}
.grab:active{cursor:grabbing}

@media (min-width:821px){
  :root{ --panel-w:390px; }
  /* 세로 공간이 남으므로 길찾기를 접어 둘 이유가 없다 */
  .trip{display:block}
  #btnRoute{display:none}
  #map{left:var(--panel-w)}
  .panel{
    left:0;right:auto;top:var(--header-h);bottom:0;width:var(--panel-w);height:auto;
    border-radius:0;border-right:1px solid var(--line);box-shadow:none;
    transform:none;touch-action:auto;
  }
  .grab{display:none}
}

/* ---------- 접힌 상태의 한 줄 요약 ---------- *
 * 첫 화면에서 필요한 답은 하나다 — 가장 가까운 정류장에 다음 버스가 언제 오는가.
 * 목록은 올려야 나온다.
 */
.hero[hidden]{display:none}
.hero{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:6px 14px 14px;border:0;background:none;
}
.hero-stop{
  font-size:16.5px;font-weight:900;letter-spacing:-.03em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hero-walk{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.hero-eta{
  margin-left:auto;display:flex;align-items:baseline;gap:7px;white-space:nowrap;
}
.hero-eta b{font-size:21px;font-weight:900;letter-spacing:-.04em}
.hero-eta b.soon{color:var(--postech-red)}
.hero-eta .at{font-size:13.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.hero-ask{
  color:var(--postech-red);font-size:15px;font-weight:900;display:flex;
  align-items:center;gap:8px;
}
.hero-quiet{font-size:15px;font-weight:800;color:var(--muted)}
.hero-chev{margin-left:auto;color:#B9BFC8;font-size:14px}

/* ---------- route filter ---------- */
.filters{
  padding:4px 14px 11px;border-bottom:1px solid var(--line);
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;touch-action:pan-x;
}
.filters::-webkit-scrollbar{display:none}
.filters[hidden]{display:none}
.filters::after{content:"";flex:0 0 4px}   /* 가로 스크롤 끝 여백 */
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 14px;font-size:15px;font-weight:800;color:#69717d;
  display:inline-flex;align-items:center;gap:6px;line-height:1.2;
}
.chip.on{color:#fff;border-color:transparent}

/* ---------- trip planner ---------- */
.trip{display:none;padding:12px 14px;border-bottom:1px solid var(--line);background:#FBFBFC}
.trip.show{display:block}
.trip-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.pin{
  flex:0 0 auto;font-size:12.5px;font-weight:900;color:#fff;border-radius:6px;
  padding:4px 6px;letter-spacing:-.02em;
}
.pin.from{background:#1a73e8}
.pin.to{background:var(--postech-red)}
.trip input{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;
  padding:8px 11px;font-size:15px;font-weight:700;background:#fff;
}
.trip input:focus{outline:0;border-color:var(--postech-red);box-shadow:0 0 0 3px rgba(166,25,85,.1)}
.mini{
  flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);background:#fff;
  border-radius:10px;font-size:15.5px;line-height:1;color:#555;
}
.mini.wide{width:auto;padding:0 11px;font-size:14px;font-weight:800}
.mini:hover{background:var(--soft);color:var(--postech-red)}
/* 결과가 나오면 입력칸 두 줄을 한 줄 요약으로 접는다 */
.trip.done .trip-fields{display:none}
.trip-summary{
  width:100%;overflow:hidden;border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:11px 13px;font-size:15.5px;font-weight:800;text-align:left;color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.trip-summary[hidden]{display:none}
.trip-summary:hover{border-color:#bfc6d0;background:#fcfcfd}
.trip-summary .arrow{flex:0 0 auto;color:var(--muted);font-weight:900}
.trip-summary .edit{flex:0 0 auto;margin-left:auto;color:var(--muted);font-size:15px}
.trip-summary b{font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 출발 시각 */
.trip-when{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:2px}
.trip-when .mode{
  border:1px solid var(--line);border-radius:9px;padding:6px 10px;
  background:#fff;color:#69717d;font-size:12.5px;font-weight:900;text-decoration:none;
}
.trip-when .mode:hover{background:var(--soft);color:var(--ink)}
.trip-when button{
  border:0;background:none;color:var(--muted);font-size:14.5px;font-weight:800;
  padding:6px 2px;text-decoration:underline;text-underline-offset:3px;
}
.trip-when button:hover{color:var(--postech-red)}
.trip-when input[type=time]{
  border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:16.5px;font-weight:800;
}
.suggest{max-height:230px;overflow-y:auto;margin:0 0 7px;border-radius:11px}
.suggest:not(:empty){border:1px solid var(--line);background:#fff;margin-bottom:9px}
.sug{padding:11px 12px;min-height:46px;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.sug+.sug{border-top:1px solid #EFF1F4}
.sug:hover{background:var(--postech-red-050)}
.sug-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug-kind{flex:0 0 auto;margin-left:auto;font-size:12.5px;font-weight:800;color:#9AA1AC}
.sug .d{flex:0 0 auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- itinerary ---------- */
.itin{border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;background:#fff}
.itin.best{border-color:var(--postech-red);box-shadow:0 0 0 3px rgba(166,25,85,.08)}
.itin-head{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.itin-dur{font-size:20px;font-weight:900;letter-spacing:-.04em}
.itin-time{font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.itin-tag{margin-left:auto;font-size:13px;font-weight:800;color:var(--muted)}
.leg{display:flex;gap:9px;font-size:14.5px;padding:4px 0;align-items:flex-start}
.leg .ic{
  flex:0 0 auto;min-width:26px;height:23px;padding:0 6px;border-radius:7px;
  display:grid;place-items:center;white-space:nowrap;
  font-size:12.5px;font-weight:900;color:#fff;background:#AAB1BB;
}
/* 도보 구간은 글자로 이미 "도보"라고 말하고 있으니, 자리만 잡아 정렬을 맞춘다 */
.leg .ic.walk{
  background:none;position:relative;
}
.leg .ic.walk::before{
  content:"";width:3px;height:15px;border-left:3px dotted #C2C8D0;border-radius:2px;
}
.leg .txt{min-width:0}
.leg b{font-weight:900}
.leg .sub{display:block;color:var(--muted);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* 출근·퇴근 전환 — 알약이 아니라 밑줄로 구분한다 */
.period{display:flex;align-items:baseline;gap:14px;margin:16px 0 2px}
.period button{
  border:0;background:none;padding:4px 0;font-size:16px;font-weight:900;
  color:#9AA1AC;letter-spacing:-.03em;border-bottom:2.5px solid transparent;
}
.period button.on{color:var(--ink);border-bottom-color:var(--postech-red)}
.period-time{
  margin-left:auto;font-size:12.5px;font-weight:800;color:var(--muted);
  font-variant-numeric:tabular-nums;
}

/* ---------- sections ---------- */
.sec-title{
  font-size:13.5px;font-weight:900;letter-spacing:.06em;color:var(--muted);
  text-transform:uppercase;margin:18px 0 8px;display:flex;align-items:center;gap:8px;
}

/* ---------- stop cards ---------- */
.stop{
  border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:8px;background:#fff;
}
.stop:hover{border-color:#bfc6d0;background:#fcfcfd}
.stop.active{border-color:var(--postech-red);background:var(--postech-red-050);box-shadow:0 0 0 3px rgba(166,25,85,.08)}
.stop-head{display:flex;align-items:baseline;gap:8px}
.stop-name{font-weight:900;font-size:16px;letter-spacing:-.03em;flex:1;min-width:0}
.stop-dist{font-size:13.5px;font-weight:800;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.arrivals{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.arr{display:flex;align-items:center;gap:8px;font-size:15px}
.badge{
  flex:0 0 auto;min-width:26px;height:23px;padding:0 7px;border-radius:7px;color:#fff;
  font-size:12.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;letter-spacing:-.03em;
}
.arr-eta{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.arr-eta.soon{color:var(--postech-red)}
.arr-eta.far{color:var(--muted);font-weight:800}
.side{font-size:12.5px;font-weight:800;color:#8A9099}
.arr-at{color:var(--muted);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.arr-next{color:#9aa1ac;font-size:13px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.arr-toward{
  margin-left:auto;font-size:13px;font-weight:800;color:#7A818C;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%;
}
.empty{color:var(--muted);font-size:14.5px;padding:10px 2px;font-weight:600}

.panel-links{
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  margin:16px 0 4px;font-size:14.5px;font-weight:800;color:var(--muted);
}
.panel-links button,.panel-links a{
  border:0;background:none;color:var(--muted);text-decoration:underline;
  text-underline-offset:3px;padding:6px 2px;font-size:14.5px;font-weight:800;
}
.panel-links button:hover,.panel-links a:hover{color:var(--postech-red)}

/* ---------- notice ---------- */
.notice{
  margin:12px 0 0;display:flex;gap:9px;padding:11px 12px;border-radius:13px;
  border:1px solid #E8B4C7;background:var(--postech-red-050);color:var(--postech-red-700);
  font-size:14px;font-weight:700;line-height:1.5;
}
.notice.warn{border-color:#E7D2A0;background:#FFF9EC;color:#7a5a00}
.notice b{font-weight:900}

/* ---------- map markers ---------- */
.stop-marker{
  width:15px;height:15px;border-radius:50%;background:#fff;border:3.5px solid #333A45;
  box-shadow:0 1px 3px rgba(0,0,0,.28),0 0 0 1.5px rgba(255,255,255,.9);
}
#map.labels-off .stop-label{display:none}
#map.labels-off .leaflet-marker-icon.sel .stop-label{display:block;left:24px}
.stop-label{
  position:absolute;left:20px;top:-4px;white-space:nowrap;font-size:13px;font-weight:900;
  color:#1E232B;padding:1px 4px;border-radius:5px;letter-spacing:-.03em;pointer-events:none;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;
}
.leaflet-marker-icon.sel .stop-marker{
  border-color:var(--postech-red);width:21px;height:21px;margin:-3px 0 0 -3px;
  box-shadow:0 0 0 5px rgba(166,25,85,.22),0 1px 5px rgba(0,0,0,.35);
}
.arrow-icon{width:0!important;height:0!important;overflow:visible}
.arrow{
  position:absolute;left:0;top:0;font-size:19px;line-height:1;
  -webkit-text-stroke:2.5px #fff;paint-order:stroke fill;
  text-shadow:0 0 4px rgba(255,255,255,.9);
}
.bus-icon{width:0!important;height:0!important;overflow:visible}
.bus-icon .bus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.bus{
  min-width:30px;height:23px;padding:0 7px;border-radius:8px;color:#fff;
  font-size:12.5px;font-weight:900;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;
  box-shadow:0 2px 7px rgba(0,0,0,.35);border:2px solid #fff;
}
.trip-stop{
  width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #888;
  box-shadow:0 1px 5px rgba(0,0,0,.35);
}
.trip-pin{
  width:18px;height:18px;border-radius:50% 50% 50% 2px;transform:rotate(-45deg);
  border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.trip-pin.from{background:#1a73e8}
.trip-pin.to{background:var(--postech-red)}
.me{
  width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;
  box-shadow:0 0 0 2px rgba(26,115,232,.35),0 2px 6px rgba(0,0,0,.3);
}
.leaflet-container{font-family:inherit}


/* 지도에서 출발·도착 지정 */
.pa-popup .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.pa-popup .leaflet-popup-content{margin:11px 13px;font:inherit}
.pa{display:flex;align-items:center;gap:7px}
.pa-name{font-size:15px;font-weight:900;letter-spacing:-.03em;margin-right:3px;max-width:150px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pa button{
  border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:8px 12px;font-size:15px;font-weight:900;color:#444B57;
}
.pa button[data-w="from"]:hover{background:#1a73e8;border-color:#1a73e8;color:#fff}
.pa button[data-w="to"]:hover{background:var(--postech-red);border-color:var(--postech-red);color:#fff}

/* 내 위치 직접 지정 */
.pick-hint{
  position:fixed;left:12px;right:12px;top:calc(var(--header-h) + 12px);z-index:900;
  background:#1a73e8;color:#fff;border-radius:14px;box-shadow:var(--shadow);
  padding:12px 14px;display:flex;align-items:center;gap:10px;
  font-size:14px;font-weight:800;
}
.pick-hint[hidden]{display:none}
.pick-hint button{
  margin-left:auto;border:0;background:rgba(255,255,255,.2);color:#fff;
  border-radius:9px;padding:7px 12px;font-size:13px;font-weight:800;
}
.pick-hint.update{background:#333A45}
#map.picking{cursor:crosshair}
@media (min-width:821px){ .pick-hint{left:calc(var(--panel-w) + 12px);right:74px} }

/* ---------- 위치 권한 안내 ---------- */
.ask{
  position:fixed;inset:var(--header-h) 0 0 0;z-index:1100;
  background:rgba(20,22,26,.42);display:grid;place-items:center;padding:18px;
}
.ask[hidden]{display:none}   /* display 선언이 hidden 속성을 덮으므로 명시한다 */
.ask-card{
  width:min(360px,100%);background:#fff;border-radius:20px;padding:20px 20px 16px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center;
}
.ask-icon{
  width:46px;height:46px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  background:var(--postech-red-050);color:var(--postech-red);font-size:23px;
}
.ask-card strong{display:block;font-size:18px;letter-spacing:-.03em;margin-bottom:7px}
.ask-card p{margin:0 0 16px;font-size:15px;line-height:1.6;color:var(--muted);font-weight:600}
.ask-card p b{color:var(--ink)}
.ask-actions{display:flex;gap:8px}
.ask-actions button{
  flex:1;border-radius:12px;padding:13px 10px;font-size:15.5px;font-weight:900;border:1px solid var(--line);
}
.ask-no{background:#fff;color:#69717d}
.ask-no:hover{background:var(--soft)}
.ask-yes{background:var(--postech-red);border-color:var(--postech-red);color:#fff}
.ask-yes:hover{background:var(--postech-red-700)}
.ask-steps{text-align:left;margin:0 0 16px;padding-left:18px;font-size:15px;line-height:1.7;color:var(--muted);font-weight:700}
.ask-steps li+li{margin-top:2px}

/* ---------- floating map buttons ---------- */
.mapbtns{
  position:fixed;z-index:850;display:flex;flex-direction:column;gap:9px;
  right:max(12px, env(safe-area-inset-right));
  bottom:calc(var(--sheet) + 14px);
  transition:bottom .26s cubic-bezier(.22,.7,.3,1);
}
.mapbtn{
  width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;
  box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;line-height:1;
  color:#3d434c;
}
@media (min-width:821px){
  .mapbtns{bottom:26px;transition:none}
}
.mapbtn.on{background:var(--postech-red);border-color:var(--postech-red);color:#fff}

/* ---------- edit mode ---------- */
.editbar{
  position:fixed;left:12px;right:12px;top:calc(var(--header-h) + 12px);z-index:850;background:#FFF9EC;
  border:1px solid #E7D2A0;border-radius:14px;box-shadow:var(--shadow);padding:10px 13px;
  display:none;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:14.5px;font-weight:800;color:#7a5a00;
}
.editbar.show{display:flex}
.editbar>span{flex:1 1 auto;min-width:0}
@media (min-width:821px){
  /* 지도가 패널 오른쪽에서 시작하므로 편집 바도 그 안쪽에 둔다 */
  .editbar{left:calc(var(--panel-w) + 12px);right:74px}
}
.editbar button{
  border:1px solid #E7D2A0;background:#fff;border-radius:9px;padding:6px 11px;
  font-size:14px;font-weight:800;color:#7a5a00;
}

/* ---------- 좁은 화면 미세 조정 ---------- */
@media (max-width:520px){
  :root{--header-h:54px}
  .brand-long{display:none}
  .hdr .sub{display:none}
  .hdr strong{font-size:17px}
  .hdr-btn.desk,.mapbtn.desk{display:none}
  .clock{font-size:16.5px;padding:7px 11px}
  .hdr-btn{padding:9px 13px;font-size:15px}
  .stop{padding:13px 14px}
  .stop-name{font-size:16.5px}
  .arr{font-size:15px}
  .badge{min-width:28px;height:24px}
  .trip input{padding:10px 12px;font-size:17.5px}  /* 16px 미만이면 iOS가 입력 시 확대한다 */
  .mini{width:38px;height:38px}
  .itin-dur{font-size:22px}
  .leg{font-size:15px;padding:5px 0}
}
@media (max-width:380px){
  .hdr strong{font-size:15.5px}
  .hdr-btn{padding:8px 10px;font-size:15px}
  .clock{font-size:15.5px;padding:6px 8px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="brand">
    <strong><span id="brandShort">POSTECH 셔틀</span><span class="brand-long" id="brandLong"> 버스 지도</span></strong>
    <span class="sub" id="tagline">시간표 기반 운행 위치 · 실시간 GPS 아님</span>
  </div>
  <div class="spacer"></div>
  <div class="clock" id="clock"><span id="clockH">--</span><span class="colon">:</span><span id="clockM">--</span></div>
  <button class="hdr-btn primary" id="btnRoute">길찾기</button>
  <a class="hdr-btn desk" id="lnkTimetable" href="./timetable.html">시간표</a>
</header>

<aside class="panel" id="panel">
  <div class="grab" id="grab"><span></span></div>
  <button class="hero" id="hero"></button>
  <div class="trip" id="trip">
    <button class="trip-summary" id="tripSummary" hidden></button>
    <div class="trip-fields" id="tripFields">
      <div class="trip-row">
        <span class="pin from" id="pinFrom">출발</span>
        <input id="inFrom" placeholder="출발지" autocomplete="off">
        <button class="mini" id="btnHere" title="내 위치로" aria-label="내 위치로">◎</button>
      </div>
      <div class="trip-row">
        <span class="pin to" id="pinTo">도착</span>
        <input id="inTo" placeholder="도착지" autocomplete="off">
        <button class="mini" id="btnSwap" title="출발·도착 바꾸기" aria-label="출발·도착 바꾸기">⇅</button>
      </div>
      <div class="suggest" id="suggest"></div>
      <div class="trip-when">
        <button id="btnMode" class="mode">출발</button>
        <button id="btnWhen">지금 출발</button>
        <input type="time" id="whenTime" hidden>
      </div>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="panel-scroll" id="panelScroll"></div>
</aside>

<div id="map">
  <div class="editbar" id="editbar">
    <span id="editHint">좌표 보정 모드 — 정류장 마커를 끌어 실제 위치로 옮기세요.</span>
    <button id="btnCopy">JSON 복사</button>
    <button id="btnResetCoords">되돌리기</button>
  </div>
  <div class="pick-hint update" id="updateHint" hidden>
    <span id="updateText">새 버전이 있습니다</span>
    <button id="updateNow">새로고침</button>
  </div>
  <div class="pick-hint" id="pickHint" hidden>
    <span id="pickHintText">지도에서 지금 계신 곳을 눌러 주세요</span>
    <button id="pickCancel">취소</button>
  </div>
  <div class="ask" id="ask" hidden>
    <div class="ask-card">
      <div class="ask-icon">◎</div>
      <strong id="askTitle">가까운 정류장부터 보기</strong>
      <p id="askBody">위치는 이 브라우저 안에서만 쓰입니다.</p>
      <div class="ask-actions">
        <button class="ask-no" id="askNo">나중에</button>
        <button class="ask-yes" id="askYes">위치 허용</button>
      </div>
    </div>
  </div>
  <div class="mapbtns">
    <button class="mapbtn" id="btnLoc" title="내 위치" aria-label="내 위치">◎</button>
    <button class="mapbtn" id="btnFit" title="전체 보기" aria-label="전체 보기">⤢</button>
    <button class="mapbtn" id="btnBase" title="지도 종류" aria-label="지도 종류">◻</button>
    <button class="mapbtn desk" id="btnEdit" title="좌표 보정" aria-label="좌표 보정">✎</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="./map-data.js"></script>
<script src="./i18n.js"></script>
<script src="./walk.js"></script>
<script src="./planner.js"></script>
<script src="./map.js"></script>
<script>
/* 오프라인 지원. 시간표·노선·보행 그래프가 전부 정적 파일이라
   지도 타일만 받아 두면 통째로 오프라인으로 동작한다. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      const show = w => {
        const el = document.getElementById('updateHint');
        el.hidden = false;
        document.getElementById('updateNow').onclick = () => {
          w.postMessage('skipWaiting');
          location.reload();
        };
      };
      if (reg.waiting) show(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w?.addEventListener('statechange', () => {
          // 이미 쓰고 있는 중에 새 버전이 준비된 경우만 알린다
          if (w.state === 'installed' && navigator.serviceWorker.controller) show(w);
        });
      });
    } catch (e) { /* 오프라인 지원 없이도 그대로 동작한다 */ }
  });
}
</script>
</body>
</html>
