<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포스텍 셔틀버스</title>
<meta name="description" content="포스텍 교내 셔틀버스를 지도에서 봅니다.">
<link rel="icon" href="./icon-192.png">
<style>
:root{ --ink:#1E232B; --muted:#69717d; --line:#E3E6EB; --soft:#F6F7F9; --red:#A61955; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#fff;color:var(--ink);
  font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.6;letter-spacing:-.015em;word-break:keep-all;
}
a{color:inherit}
.pad{padding:0 max(22px, env(safe-area-inset-left))}

header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:44px 0 26px}
h1{margin:0;font-size:29px;font-weight:900;letter-spacing:-.04em}
.open{
  background:var(--red);color:#fff;text-decoration:none;
  padding:9px 18px;border-radius:11px;font-weight:900;font-size:15px;
}
.open:hover{background:#900048}

/* 좌우로 넘겨 본다. 세로로 쌓으면 스크롤이 길어지기만 한다. */
.deck{
  display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:0 max(22px, env(safe-area-inset-left)) 26px;
  scroll-padding-left:max(22px, env(safe-area-inset-left));
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.deck::-webkit-scrollbar{display:none}
.card{flex:0 0 236px;scroll-snap-align:start}
.card h2{margin:0 0 10px;font-size:16px;font-weight:900;letter-spacing:-.03em}
video{
  display:block;width:236px;border-radius:18px;
  border:1px solid var(--line);background:var(--soft);
}

footer{color:var(--muted);font-size:13.5px;padding:0 0 44px}
footer p{margin:0 0 5px}
footer a{color:var(--red);font-weight:800;text-decoration:none}
</style>

<header class="pad">
  <h1>포스텍 셔틀버스</h1>
  <a class="open" href="./">열기</a>
</header>

<div class="deck">
  <div class="card"><h2>버스가 지금 어디쯤</h2>
    <video src="./promo/midday.mp4" autoplay muted loop playsinline></video></div>
  <div class="card"><h2>노선별로</h2>
    <video src="./promo/rush.mp4" autoplay muted loop playsinline></video></div>
  <div class="card"><h2>정류장을 누르면</h2>
    <video src="./promo/stop.mp4" autoplay muted loop playsinline></video></div>
  <div class="card"><h2>길찾기</h2>
    <video src="./promo/trip.mp4" autoplay muted loop playsinline></video></div>
</div>

<footer class="pad">
  <p>버스 위치는 시간표에서 계산한 값입니다.</p>
  <p>2026년 8월 3일 시행 · 평일만 운행</p>
  <p><a href="./">bus.ysw.kr</a></p>
</footer>
