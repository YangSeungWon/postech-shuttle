<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POSTECH 셔틀버스 실시간 지도</title>
<meta name="description" content="POSTECH 셔틀버스 노선·정류장을 지도에서 보고, 내 위치 기준으로 다음 버스까지 남은 시간을 확인합니다.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --postech-red:#A61955; --postech-red-700:#900048; --postech-red-050:#FCEEF3;
  --ink:#222; --muted:#666A73; --line:#D9DDE3; --soft:#F5F6F8; --paper:#fff; --bg:#F2F3F5;
  --shadow:0 8px 26px rgba(0,0,0,.08);
  --panel-w:390px; --header-h:58px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.55;letter-spacing:-.012em;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}

/* ---------- header ---------- */
.hdr{
  position:fixed;inset:0 0 auto 0;height:var(--header-h);z-index:1000;
  background:#fff;border-top:3px solid var(--postech-red);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;padding:0 12px;
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
}
.brand{min-width:0;overflow:hidden}
.hdr strong{font-size:15px;letter-spacing:-.03em;display:block;white-space:nowrap}
.hdr .sub{
  font-size:11px;color:var(--muted);display:block;font-weight:600;margin-top:-2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hdr .spacer{flex:1}
.hdr-btn.primary{background:var(--postech-red);border-color:var(--postech-red);color:#fff}
.hdr-btn.primary:hover{background:var(--postech-red-700);color:#fff}
.hdr-btn{
  border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:7px 11px;font-size:12.5px;font-weight:800;color:#444B57;white-space:nowrap;
}
.hdr-btn:hover{background:var(--soft);color:var(--postech-red)}
.hdr-btn.on{background:var(--postech-red);border-color:var(--postech-red);color:#fff}
.clock{
  font-variant-numeric:tabular-nums;font-weight:900;font-size:14px;
  padding:6px 10px;border-radius:9px;background:var(--soft);color:#333;
}
.clock.sim{background:#FFF4D6;color:#8a6100}

/* ---------- layout ---------- *
 * 모바일이 기본. 지도는 화면 전체를 채우고 패널이 바텀시트로 그 위에 뜬다.
 * 시트가 가리는 높이를 --sheet 로 알려 주어 지도 버튼과 fitBounds 가 피해 간다.
 */
:root{ --sheet:46dvh; --sheet-max:88dvh; }  /* JS 가 로드되면 px 값으로 덮어쓴다 */

#map{
  position:fixed;left:0;right:0;top:var(--header-h);bottom:0;background:#e8eaed;
}
.panel{
  position:fixed;left:0;right:0;bottom:0;z-index:900;
  height:var(--sheet-max);
  background:#fff;border-radius:20px 20px 0 0;
  box-shadow:0 -6px 28px rgba(0,0,0,.16);
  display:flex;flex-direction:column;
  transform:translateY(calc(var(--sheet-max) - var(--sheet)));
  transition:transform .26s cubic-bezier(.22,.7,.3,1);
  touch-action:none;
}
.panel.dragging{transition:none}
.panel-scroll{
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  flex:1;padding:0 14px calc(28px + env(safe-area-inset-bottom));touch-action:pan-y;
}
/* 시트 손잡이 */
.grab{
  height:22px;display:grid;place-items:center;flex:0 0 auto;cursor:grab;
  touch-action:none;
}
.grab span{width:38px;height:4px;border-radius:99px;background:#D3D7DE}
.grab:active{cursor:grabbing}

@media (min-width:821px){
  :root{ --panel-w:390px; }
  #map{left:var(--panel-w)}
  .panel{
    left:0;right:auto;top:var(--header-h);bottom:0;width:var(--panel-w);height:auto;
    border-radius:0;border-right:1px solid var(--line);box-shadow:none;
    transform:none;touch-action:auto;
  }
  .grab{display:none}
}

/* ---------- route filter ---------- */
.filters{
  padding:4px 14px 11px;border-bottom:1px solid var(--line);
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;touch-action:pan-x;
}
.filters::-webkit-scrollbar{display:none}
.filters::after{content:"";flex:0 0 4px}   /* 가로 스크롤 끝 여백 */
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 14px;font-size:13px;font-weight:800;color:#69717d;
  display:inline-flex;align-items:center;gap:6px;line-height:1.2;
}
.chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.35}
.chip.on{color:#fff;border-color:transparent}
.chip.on .dot{background:#fff;opacity:.9}

/* ---------- trip planner ---------- */
.trip{display:none;padding:12px 14px;border-bottom:1px solid var(--line);background:#FBFBFC}
.trip.show{display:block}
.trip-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.pin{
  flex:0 0 auto;font-size:10.5px;font-weight:900;color:#fff;border-radius:6px;
  padding:4px 6px;letter-spacing:-.02em;
}
.pin.from{background:#1a73e8}
.pin.to{background:var(--postech-red)}
.trip input{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;
  padding:8px 11px;font-size:13.5px;font-weight:700;background:#fff;
}
.trip input:focus{outline:0;border-color:var(--postech-red);box-shadow:0 0 0 3px rgba(166,25,85,.1)}
.mini{
  flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);background:#fff;
  border-radius:10px;font-size:14px;line-height:1;color:#555;
}
.mini.wide{width:auto;padding:0 11px;font-size:12px;font-weight:800}
.mini:hover{background:var(--soft);color:var(--postech-red)}
.trip-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)}
.suggest{max-height:230px;overflow-y:auto;margin:0 0 7px;border-radius:11px}
.suggest:not(:empty){border:1px solid var(--line);background:#fff;margin-bottom:9px}
.sug{padding:11px 12px;min-height:46px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.sug+.sug{border-top:1px solid #EFF1F4}
.sug:hover{background:var(--postech-red-050)}
.sug .kind{font-size:10.5px;font-weight:900;color:#fff;background:#B9BEC7;border-radius:5px;padding:2px 5px;flex:0 0 auto}
.sug .kind.stop{background:var(--postech-red)}
.sug .d{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- itinerary ---------- */
.itin{border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;background:#fff}
.itin.best{border-color:var(--postech-red);box-shadow:0 0 0 3px rgba(166,25,85,.08)}
.itin-head{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.itin-dur{font-size:19px;font-weight:900;letter-spacing:-.04em}
.itin-time{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.itin-tag{margin-left:auto;font-size:11px;font-weight:900;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 8px}
.leg{display:flex;gap:9px;font-size:12.5px;padding:4px 0;align-items:flex-start}
.leg .ic{
  flex:0 0 auto;width:24px;height:22px;border-radius:7px;display:grid;place-items:center;
  font-size:11px;font-weight:900;color:#fff;background:#AAB1BB;
}
.leg .txt{min-width:0}
.leg b{font-weight:900}
.leg .sub{display:block;color:var(--muted);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- sections ---------- */
.sec-title{
  font-size:11.5px;font-weight:900;letter-spacing:.06em;color:var(--muted);
  text-transform:uppercase;margin:18px 0 8px;display:flex;align-items:center;gap:8px;
}
.sec-title .count{background:var(--soft);border-radius:999px;padding:2px 7px;font-size:11px;letter-spacing:0}

/* ---------- stop cards ---------- */
.stop{
  border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:8px;background:#fff;
}
.stop:hover{border-color:#bfc6d0;background:#fcfcfd}
.stop.active{border-color:var(--postech-red);background:var(--postech-red-050);box-shadow:0 0 0 3px rgba(166,25,85,.08)}
.stop-head{display:flex;align-items:baseline;gap:8px}
.stop-name{font-weight:900;font-size:14.5px;letter-spacing:-.03em;flex:1;min-width:0}
.stop-dist{font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.arrivals{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.arr{display:flex;align-items:center;gap:8px;font-size:13px}
.badge{
  flex:0 0 auto;min-width:26px;height:22px;padding:0 7px;border-radius:7px;color:#fff;
  font-size:11.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;
}
.arr-eta{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.arr-eta.soon{color:var(--postech-red)}
.arr-at{color:var(--muted);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.arr-next{color:#9aa1ac;font-size:11px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:12.5px;padding:10px 2px;font-weight:600}

.panel-links{
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  margin:16px 0 4px;font-size:12.5px;font-weight:800;color:var(--muted);
}
.panel-links button,.panel-links a{
  border:0;background:none;color:var(--muted);text-decoration:underline;
  text-underline-offset:3px;padding:6px 2px;font-size:12.5px;font-weight:800;
}
.panel-links button:hover,.panel-links a:hover{color:var(--postech-red)}

/* ---------- notice ---------- */
.notice{
  margin:12px 0 0;display:flex;gap:9px;padding:11px 12px;border-radius:13px;
  border:1px solid #E8B4C7;background:var(--postech-red-050);color:var(--postech-red-700);
  font-size:12px;font-weight:700;line-height:1.5;
}
.notice.warn{border-color:#E7D2A0;background:#FFF9EC;color:#7a5a00}
.notice b{font-weight:900}

/* ---------- map markers ---------- */
.stop-marker{
  width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--postech-gray,#7A7772);
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}
#map.labels-off .stop-label{display:none}
#map.labels-off .leaflet-marker-icon.sel .stop-label{display:block;left:24px}
.stop-label{
  position:absolute;left:19px;top:-4px;white-space:nowrap;font-size:11px;font-weight:900;
  color:#2b2f36;background:rgba(255,255,255,.88);padding:1px 5px;border-radius:5px;
  letter-spacing:-.03em;pointer-events:none;
}
.leaflet-marker-icon.sel .stop-marker{
  border-color:var(--postech-red);width:20px;height:20px;margin:-3px 0 0 -3px;
  box-shadow:0 0 0 5px rgba(166,25,85,.22),0 1px 5px rgba(0,0,0,.35);
}
.bus{
  width:30px;height:22px;border-radius:8px;color:#fff;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;
  box-shadow:0 2px 7px rgba(0,0,0,.35);border:2px solid #fff;
}
.trip-pin{
  width:18px;height:18px;border-radius:50% 50% 50% 2px;transform:rotate(-45deg);
  border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.trip-pin.from{background:#1a73e8}
.trip-pin.to{background:var(--postech-red)}
.me{
  width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;
  box-shadow:0 0 0 2px rgba(26,115,232,.35),0 2px 6px rgba(0,0,0,.3);
}
.leaflet-container{font-family:inherit}

/* ---------- floating map buttons ---------- */
.mapbtns{
  position:fixed;z-index:850;display:flex;flex-direction:column;gap:9px;
  right:max(12px, env(safe-area-inset-right));
  bottom:calc(var(--sheet) + 14px);
  transition:bottom .26s cubic-bezier(.22,.7,.3,1);
}
.mapbtn{
  width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;
  box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;line-height:1;
  color:#3d434c;
}
@media (min-width:821px){
  .mapbtns{bottom:26px;transition:none}
}
.mapbtn.on{background:var(--postech-red);border-color:var(--postech-red);color:#fff}

/* ---------- sim time bar ---------- */
.simbar{
  position:fixed;left:max(12px, env(safe-area-inset-left));right:74px;z-index:850;background:#fff;
  bottom:calc(var(--sheet) + 14px);transition:bottom .26s cubic-bezier(.22,.7,.3,1);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:9px 13px;
  display:none;align-items:center;gap:11px;
}
.simbar.show{display:flex}
.simbar input[type=range]{flex:1;accent-color:var(--postech-red)}
.simbar .lbl{font-size:12px;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.simbar .reset{border:0;background:var(--soft);border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:800;color:#555}

/* ---------- edit mode ---------- */
.editbar{
  position:fixed;left:12px;right:12px;top:calc(var(--header-h) + 12px);z-index:850;background:#FFF9EC;
  border:1px solid #E7D2A0;border-radius:14px;box-shadow:var(--shadow);padding:10px 13px;
  display:none;align-items:center;gap:11px;font-size:12.5px;font-weight:800;color:#7a5a00;
}
.editbar.show{display:flex}
.editbar button{
  border:1px solid #E7D2A0;background:#fff;border-radius:9px;padding:6px 11px;
  font-size:12px;font-weight:800;color:#7a5a00;
}

/* ---------- 좁은 화면 미세 조정 ---------- */
@media (max-width:520px){
  :root{--header-h:54px}
  .brand-long{display:none}
  .hdr .sub{display:none}
  .hdr strong{font-size:15.5px}
  .hdr-btn.desk,.mapbtn.desk{display:none}
  .clock{font-size:15px;padding:7px 11px}
  .hdr-btn{padding:9px 13px;font-size:13.5px}
  .stop{padding:13px 14px}
  .stop-name{font-size:15px}
  .arr{font-size:13.5px}
  .badge{min-width:28px;height:24px}
  .trip input{padding:10px 12px;font-size:16px}  /* 16px 미만이면 iOS가 입력 시 확대한다 */
  .mini{width:38px;height:38px}
  .itin-dur{font-size:21px}
  .leg{font-size:13.5px;padding:5px 0}
}
@media (max-width:380px){
  .hdr strong{font-size:14px}
  .hdr-btn{padding:8px 10px;font-size:13px}
  .clock{font-size:14px;padding:6px 8px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="brand">
    <strong>POSTECH 셔틀<span class="brand-long"> 버스 지도</span></strong>
    <span class="sub">시간표 기반 운행 위치 · 실시간 GPS 아님</span>
  </div>
  <div class="spacer"></div>
  <div class="clock" id="clock">--:--</div>
  <button class="hdr-btn primary" id="btnRoute">길찾기</button>
  <a class="hdr-btn desk" href="./timetable.html">시간표</a>
</header>

<aside class="panel" id="panel">
  <div class="grab" id="grab"><span></span></div>
  <div class="trip" id="trip">
    <div class="trip-row">
      <span class="pin from">출발</span>
      <input id="inFrom" placeholder="출발지 · 건물이나 정류장 이름" autocomplete="off">
      <button class="mini" id="btnHere" title="내 위치로">◎</button>
    </div>
    <div class="trip-row">
      <span class="pin to">도착</span>
      <input id="inTo" placeholder="도착지 · 건물이나 정류장 이름" autocomplete="off">
      <button class="mini" id="btnSwap" title="출발·도착 바꾸기">⇅</button>
    </div>
    <div class="suggest" id="suggest"></div>
    <div class="trip-foot">
      <span id="tripWhen">지금 출발</span>
      <button class="mini wide" id="btnCloseTrip">닫기</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="panel-scroll" id="panelScroll"></div>
</aside>

<div id="map">
  <div class="editbar" id="editbar">
    <span>좌표 보정 모드 — 정류장 마커를 끌어 실제 위치로 옮기세요.</span>
    <button id="btnCopy">JSON 복사</button>
    <button id="btnResetCoords">되돌리기</button>
  </div>
  <div class="simbar" id="simbar">
    <span class="lbl" id="simLabel">09:00</span>
    <input type="range" id="simRange" min="420" max="1140" step="1">
    <button class="reset" id="simReset">현재 시각</button>
  </div>
  <div class="mapbtns">
    <button class="mapbtn" id="btnLoc" title="내 위치" aria-label="내 위치">◎</button>
    <button class="mapbtn" id="btnFit" title="전체 보기" aria-label="전체 보기">⤢</button>
    <button class="mapbtn" id="btnSim" title="시간 이동" aria-label="시간 이동">◷</button>
    <button class="mapbtn desk" id="btnEdit" title="좌표 보정" aria-label="좌표 보정">✎</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="./map-data.js"></script>
<script src="./walk.js"></script>
<script src="./planner.js"></script>
<script src="./map.js"></script>
</body>
</html>
