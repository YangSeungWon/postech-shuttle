<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POSTECH 셔틀버스 실시간 지도</title>
<meta name="description" content="POSTECH 셔틀버스 노선·정류장을 지도에서 보고, 내 위치 기준으로 다음 버스까지 남은 시간을 확인합니다.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#A61955">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="POSTECH 셔틀">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
:root{
  --postech-red:#A61955; --postech-red-700:#900048; --postech-red-050:#FCEEF3;
  --ink:#222; --muted:#666A73; --line:#D9DDE3; --soft:#F5F6F8; --paper:#fff; --bg:#F2F3F5;
  --shadow:0 8px 26px rgba(0,0,0,.08);
  --panel-w:390px; --header-h:58px;
}
*{box-sizing:border-box}
/* 키보드로 옮겨 다닐 때 지금 어디인지 보여야 한다 */
:focus-visible{
  outline:3px solid var(--postech-red);outline-offset:2px;border-radius:6px;
}
.maplibregl-map :focus-visible{outline-offset:1px}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.6;letter-spacing:-.012em;
  /* 한글은 기본이 아무 데서나 끊겨 "무은재삼 / 거리" 처럼 갈린다.
     낱말째로 넘긴다. 아주 긴 한 덩어리만 예외로 끊는다. */
  word-break:keep-all;overflow-wrap:break-word;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}

/* 키보드 사용자가 헤더를 건너뛸 수 있게 */
.skip{
  position:fixed;left:-999px;top:8px;z-index:2000;background:var(--postech-red);
  color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:900;
}
.skip:focus{left:8px}

/* ---------- header ---------- */
.hdr{
  position:fixed;inset:0 0 auto 0;height:var(--header-h);z-index:1000;
  background:#fff;border-top:3px solid var(--postech-red);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;padding:0 12px;
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
}
.brand{min-width:0;overflow:hidden}
.hdr strong{font-size:16.5px;letter-spacing:-.03em;display:block;white-space:nowrap}
.hdr .sub{
  font-size:13px;color:var(--muted);display:block;font-weight:600;margin-top:-2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hdr .spacer{flex:1}
.hdr-btn.primary{background:var(--postech-red);border-color:var(--postech-red);color:#fff}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto}
.lang button{
  border:0;background:#fff;color:#69717d;padding:6px 10px;
  font-size:13px;font-weight:900;line-height:1;
}
.lang button.on{background:var(--postech-red);color:#fff}
.lang button:not(.on):hover{background:var(--soft);color:var(--ink)}
.hdr-btn.primary:hover{background:var(--postech-red-700);color:#fff}
.hdr-btn{
  border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:7px 11px;font-size:14.5px;font-weight:800;color:#444B57;white-space:nowrap;
}
.hdr-btn:hover{background:var(--soft);color:var(--postech-red)}
.hdr-btn.on{background:var(--postech-red);border-color:var(--postech-red);color:#fff}
.clock{
  font-variant-numeric:tabular-nums;font-weight:900;font-size:15.5px;
  padding:6px 10px;border-radius:9px;background:var(--soft);color:#333;
}
.clock.sim{background:#FFF4D6;color:#8a6100}
.clock .colon{animation:blink 1s step-end infinite;animation-delay:var(--blink-delay,0s)}
.clock.sim .colon{animation:none}          /* 옮겨 둔 시각은 지금이 아니다 */
@keyframes blink{50%{opacity:.15}}
/* ---------- layout ---------- *
 * 모바일이 기본. 지도는 화면 전체를 채우고 패널이 바텀시트로 그 위에 뜬다.
 * 시트가 가리는 높이를 --sheet 로 알려 주어 지도 버튼과 fitBounds 가 피해 간다.
 */
:root{ --sheet:46dvh; --sheet-max:88dvh; --kb:0px; --tabs-h:0px; }  /* JS 가 로드되면 px 값으로 덮어쓴다 */

#map{
  position:fixed;left:0;right:0;top:var(--header-h);bottom:0;
  /* 바탕 지도의 땅 색과 같게. 지도를 돌리면 GL 캔버스 귀퉁이가 잠깐
     드러나는데, 회색이면 눈에 띄고 같은 색이면 거의 안 보인다. */
  background:#E9EBEF;
}
/* bottom 이 --kb 인 이유: iOS 는 키보드가 올라와도 레이아웃 뷰포트가 줄지
   않아서, bottom:0 인 고정 요소가 키보드 뒤로 들어간다. 보이는 영역의
   바닥에 붙인다. */
.grab{
  height:22px;width:100%;border:0;background:none;padding:0;
  display:grid;place-items:center;flex:0 0 auto;cursor:grab;touch-action:none;
}
.grab span{width:38px;height:4px;border-radius:99px;background:#D3D7DE}
.grab:active{cursor:grabbing}
@media (min-width:821px){ .grab{display:none} }

.panel{
  position:fixed;left:0;right:0;bottom:calc(var(--kb) + var(--tabs-h));z-index:900;
  height:var(--sheet-max);
  background:#fff;border-radius:20px 20px 0 0;
  box-shadow:0 -6px 28px rgba(0,0,0,.16);
  display:flex;flex-direction:column;
  transform:translateY(calc(var(--sheet-max) - var(--sheet)));
  transition:transform .26s cubic-bezier(.22,.7,.3,1);
}
.panel.dragging{transition:none}
.panel-scroll{
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  flex:1;padding:0 14px calc(28px + env(safe-area-inset-bottom));touch-action:pan-y;
}
/* 시트 손잡이 */

/* 아래 탭바. 지도 앱들이 쓰는 자리이고, 여기 있는 넷이 이 앱의 전부다. */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:930;display:flex;
  background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1 1 0;min-width:0;border:0;background:none;padding:7px 2px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#8A9099;font-size:11px;font-weight:800;letter-spacing:-.02em;cursor:pointer;
}
.tab svg{
  width:23px;height:23px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.tab.on{color:var(--postech-red)}
.tab:active{background:var(--soft)}
@media (max-width:820px){ :root{ --tabs-h:58px } }
@media (min-width:821px){ .tabs{display:none} }
/* 길찾기는 이 앱에서 가장 자주 쓰는 동작이라, 탭에도 두고 지도 위에도 둔다.
   엄지가 닿는 자리에 하나 있는 것이 탭바를 거치는 것보다 빠르다. */

@media (min-width:821px){
  :root{ --panel-w:390px; }
  /* 세로 공간이 남으므로 길찾기를 접어 둘 이유가 없다 */
  .trip{display:block}
  #btnRoute{display:none}
  #map{left:var(--panel-w)}
  .panel{
    left:0;right:auto;top:var(--header-h);bottom:0;width:var(--panel-w);height:auto;
    border-radius:0;border-right:1px solid var(--line);box-shadow:none;
    transform:none;touch-action:auto;
  }
}

/* ---------- 접힌 상태의 한 줄 요약 ---------- *
 * 첫 화면에서 필요한 답은 하나다 — 가장 가까운 정류장에 다음 버스가 언제 오는가.
 * 목록은 올려야 나온다.
 */
.hero[hidden]{display:none}
.hero{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:6px 14px 14px;border:0;background:none;
}
.hero-stop{
  font-size:16.5px;font-weight:900;letter-spacing:-.03em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hero-walk{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.hero-eta{
  margin-left:auto;display:flex;align-items:baseline;gap:7px;white-space:nowrap;
}
.hero-eta b{font-size:21px;font-weight:900;letter-spacing:-.04em}
.hero-eta b.soon{color:var(--postech-red)}
.hero-eta b.due{font-size:15px;letter-spacing:-.02em}
.hero-eta .at{font-size:13.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.hero-ask{
  color:var(--postech-red);font-size:15px;font-weight:900;display:flex;
  align-items:center;gap:8px;
}
.hero-ask svg{
  flex:0 0 auto;width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.hero-quiet{font-size:15px;font-weight:800;color:var(--muted)}
.hero-chev{margin-left:auto;color:var(--muted);font-size:14px}

/* ---------- route filter ---------- */
/* 여섯 개가 한눈에 들어와야 한다. 영문("Loop 1"·"Yugang")은 한글보다
   넓어서 옆으로 밀려 나갔다 — 가로 스크롤은 거기 뭐가 더 있는지 안
   보여 준다. 좁으면 줄을 바꾼다. */
.filters{
  padding:4px 14px 11px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:7px 6px;
}
.filters[hidden]{display:none}
/* 지곡·유강은 출근·퇴근 표가 나란히 놓인다 — 제목만으로는 구별이 안 된다 */
.tt-period{
  margin-left:7px;font-size:12.5px;font-weight:800;color:var(--muted);
  border:1px solid var(--line);border-radius:7px;padding:2px 7px;
}
.filters::after{content:"";flex:0 0 4px}   /* 가로 스크롤 끝 여백 */
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 12px;font-size:14.5px;font-weight:800;color:#69717d;
  display:inline-flex;align-items:center;gap:6px;line-height:1.2;white-space:nowrap;
}
/* 좁은 화면에서는 한 줄에 밀어 넣기보다 글자를 조금 줄인다 */
@media (max-width:400px){ .chip{padding:8px 10px;font-size:13.5px} }
.chip.on{color:#fff;border-color:transparent}

/* ---------- trip planner ---------- */
.trip{display:none;padding:12px 14px;border-bottom:1px solid var(--line);background:#FBFBFC}
.trip-top{
  position:fixed;z-index:920;top:0;left:0;right:0;
  padding-top:env(safe-area-inset-top);background:#fff;
  box-shadow:0 2px 14px rgba(0,0,0,.12);
}
.trip-top[hidden]{display:none}
.trip-top .trip{
  border:0;border-bottom:1px solid var(--line);background:#fff;
  padding:10px calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));
}
.trip-top .trip-row{margin-bottom:6px}
.trip-top .trip-row:last-of-type{margin-bottom:0}
.trip.show{display:block}
.trip-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
/* 글자("출발"/"도착")는 뺐다 — 자리와 안내문이 이미 말하고 있었다.
   색은 남긴다. 출발 초록·도착 빨강은 지도 앱들의 관행이라 이미 읽힌다.
   색만으로 나르지는 않는다 — 모양도 다르고(빈 동그라미/채운 물방울),
   지도 위 핀과 같은 색을 쓴다. */
.pin{
  flex:0 0 auto;width:13px;height:13px;border-radius:50%;
  border:3px solid #1a8a4a;background:#fff;
}
.pin.to{border:0;background:var(--postech-red);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.trip input{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;font-size:15px;font-weight:700;background:#fff;
}
.trip input:focus{outline:0;border-color:var(--postech-red);box-shadow:0 0 0 3px rgba(166,25,85,.1)}
.mini{
  flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);background:#fff;
  border-radius:10px;font-size:15.5px;line-height:1;color:#555;
  display:grid;place-items:center;padding:0;
}
/* 내 위치 아이콘은 지도 위 ◎ 버튼과 같은 것을 쓴다 — 같은 뜻이니까 */
.mini svg{
  width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.mini.wide{width:auto;padding:0 11px;font-size:14px;font-weight:800}
.mini:hover{background:var(--soft);color:var(--postech-red)}
/* 결과가 나오면 입력칸 두 줄을 한 줄 요약으로 접는다 */
.trip.done .trip-fields{display:none}
.trip-summary{display:flex;align-items:center;gap:6px}
.trip-summary[hidden]{display:none}
/* 출발지·도착지를 각각 눌러 고친다. 길찾기 앱들의 방식이고,
   "고치기" 같은 딱지를 따로 둘 필요가 없다. */
.ts-end{
  flex:1 1 0;min-width:0;display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:11px 12px;font:inherit;font-size:15px;font-weight:900;
  color:var(--ink);text-align:left;letter-spacing:-.03em;
}
.ts-end:hover{border-color:#bfc6d0;background:#fcfcfd}
.ts-end .pin{width:11px;height:11px;border-width:2.5px}
.ts-end .pin.to{border-width:0}
.ts-end span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-summary .arrow{flex:0 0 auto;color:var(--muted);font-weight:900;font-size:14px}

/* 출발 시각 */
.suggest{max-height:min(46vh, 340px);overflow-y:auto;margin:0 0 7px;border-radius:11px}
.suggest:not(:empty){border:1px solid var(--line);background:#fff;margin-bottom:9px}
.sug{padding:11px 12px;min-height:46px;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.sug+.sug{border-top:1px solid #EFF1F4}
.sug:hover{background:var(--postech-red-050)}
.sug-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 맨 위 두 줄은 '고를 곳'이 아니라 '할 일'이다 — 아이콘을 달아 구별한다 */
.sug-act{color:var(--postech-red);font-weight:900}
.sug-ic{
  flex:0 0 auto;width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.sug-kind{flex:0 0 auto;margin-left:auto;font-size:12.5px;font-weight:800;color:var(--muted)}
.sug .d{flex:0 0 auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- itinerary ---------- */
/* button 은 브라우저가 내용을 세로 가운데로 놓는다. 가로 띠에서 카드가
   가장 높은 것에 맞춰 늘어나면 글자가 한복판에 뜬다 — 세로 흐름으로
   못 박아 위에서부터 쌓이게 한다. */
.itin{
  display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
  width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;background:#fff;
}
.itin.best{border-color:var(--postech-red);box-shadow:0 0 0 3px rgba(166,25,85,.08)}
/* 세로로 쌓아 견주는 목록이라 한 항목이 두 줄을 넘지 않게 한다 */
.itin{padding:11px 12px;margin-bottom:8px;gap:3px}
.itin-main{display:flex;align-items:baseline;gap:10px}
.itin-dur{flex:0 0 auto}
.itin-legs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.lc{
  flex:0 0 auto;min-width:24px;height:21px;padding:0 7px;border-radius:6px;
  /* grid 로 두면 안의 것들이 세로로 쌓인다 — 한 줄로 세운다 */
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  font-size:12px;font-weight:900;color:#fff;background:#AAB1BB;letter-spacing:-.03em;
}
/* 도보는 테두리만 두른 알약, 버스는 노선 색을 채운 배지.
   아이콘은 채운 글리프를 쓴다 — 선으로 그린 사람은 12px 에서 뭉갰다.
   채운 모양은 작아져도 실루엣이 남는다. */
.lc.walk{background:none;color:#5C6470;border:1px solid var(--line);font-weight:800;gap:2px}
.lc-ic{flex:0 0 auto;width:13px;height:13px;fill:currentColor;margin-left:-1px}
/* 고른 항목에서만 펼쳐지는 구간 목록 */
.itin-legs-detail{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.itin-legs-detail .leg{padding:3px 0;font-size:13.5px;align-items:center}
.itin-legs-detail .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itin-sub{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
/* 오늘 탈 수 없는 것 — 흐리게 두고 언제인지 붙인다 */
.itin.later{background:var(--soft);border-style:dashed}
.itin.later .itin-dur{color:var(--muted)}
.itin-day{
  margin-left:auto;flex:0 0 auto;font-size:12.5px;font-weight:900;
  color:#fff;background:#8A9099;border-radius:7px;padding:2px 8px;
}
.itin-head{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.itin-dur{font-size:20px;font-weight:900;letter-spacing:-.04em}
.itin-time{font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.itin-tag{margin-left:auto;font-size:13px;font-weight:800;color:var(--muted)}
.leg{display:flex;gap:9px;font-size:14.5px;padding:4px 0;align-items:flex-start}
.leg .ic{
  flex:0 0 auto;min-width:26px;height:23px;padding:0 6px;border-radius:7px;
  display:grid;place-items:center;white-space:nowrap;
  font-size:12.5px;font-weight:900;color:#fff;background:#AAB1BB;
}
/* 도보 구간은 글자로 이미 "도보"라고 말하고 있으니, 자리만 잡아 정렬을 맞춘다 */
.leg .ic.walk{
  background:none;position:relative;
}
.leg .ic.walk::before{
  content:"";width:3px;height:15px;border-left:3px dotted #C2C8D0;border-radius:2px;
}
.leg .txt{min-width:0}
.leg b{font-weight:900}
.leg.later{margin-top:6px;padding-top:9px;border-top:1px dashed var(--line);opacity:.9}
.leg .sub{display:block;color:var(--muted);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* 출근·퇴근 전환 — 알약이 아니라 밑줄로 구분한다 */
.period{display:flex;align-items:baseline;gap:14px;margin:16px 0 2px}
.period button{
  border:0;background:none;padding:4px 0;font-size:16px;font-weight:900;
  color:#69717d;letter-spacing:-.03em;border-bottom:2.5px solid transparent;
}
.period button.on{color:var(--ink);border-bottom-color:var(--postech-red)}
.period-time{
  margin-left:auto;font-size:12.5px;font-weight:800;color:var(--muted);
  font-variant-numeric:tabular-nums;
}

/* ---------- sections ---------- */
.sec-title{
  font-size:13.5px;font-weight:900;letter-spacing:.06em;color:var(--muted);
  text-transform:uppercase;margin:18px 0 8px;display:flex;align-items:center;gap:8px;
}

/* 누른 버스의 경로 */
.buscard{
  border:1px solid var(--c);border-radius:16px;background:#fff;margin:0 0 10px;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 12%, transparent);overflow:hidden;
}
.buscard-head{display:flex;align-items:center;gap:9px;padding:12px 13px 0}
.buscard-title{font-size:15.5px;font-weight:900;letter-spacing:-.03em}
.buscard-x{
  margin-left:auto;border:0;background:none;color:var(--muted);
  font-size:15px;font-weight:900;padding:4px 6px;line-height:1;
}
.buscard-sub{padding:4px 13px 10px;font-size:13px;font-weight:800;color:var(--muted)}
.bs-list{border-top:1px solid var(--line);padding:8px 13px 12px}
.bs{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14.5px;font-weight:800}
.bs-dot{
  flex:0 0 auto;width:11px;height:11px;border-radius:50%;
  background:#fff;border:2.5px solid #C6CBD3;
}
.bs.passed{color:#9AA1AC}
.bs.passed .bs-dot{background:#D9DDE3;border-color:#D9DDE3}
.bs.next{color:var(--ink)}
.bs.next .bs-name{font-weight:900}
.bs-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bs-at{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.bs.passed .bs-at{color:#B9BFC8}

/* ---------- stop cards ---------- */
.stop{
  display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:8px;background:#fff;
}
.stop:hover{border-color:#bfc6d0;background:#fcfcfd}
.stop.active{border-color:var(--postech-red);background:var(--postech-red-050);box-shadow:0 0 0 3px rgba(166,25,85,.08)}
.stop-head{display:flex;align-items:baseline;gap:8px}
.stop-name{font-weight:900;font-size:16px;letter-spacing:-.03em;flex:1;min-width:0}
.stop-dist{font-size:13.5px;font-weight:800;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.arrivals{margin-top:9px;display:flex;flex-direction:column;gap:6px}
/* 한 줄을 넘지 않는다. 영문에서 "2 min" 이 낱말 사이에서 갈리거나
   "도착 또는 출발" 이 두 줄이 되면 줄 높이가 들쭉날쭉해진다.
   자리가 모자라면 방면 이름만 말줄임으로 줄어든다. */
.arr{display:flex;align-items:center;gap:8px;font-size:15px;flex-wrap:nowrap}
.arr > *{white-space:nowrap;flex:0 0 auto}
/* 도착 줄의 배지는 폭을 고정한다. 안 그러면 '1' 과 '유강' 의 너비가 달라
   바로 뒤의 시간이 줄마다 어긋난다. 시간은 노선에 붙어 있어야 하므로
   사이를 벌리는 대신 배지 자체를 같은 폭으로 둔다. 영문은 낱말이 길어
   더 넓게 잡는다(Yugang). */
.arr .badge{width:var(--badge-w, 40px);min-width:0;padding:0 4px}
html[lang="en"] .arr .badge{--badge-w:58px}
.badge{
  flex:0 0 auto;min-width:26px;height:23px;padding:0 7px;border-radius:7px;color:#fff;
  font-size:12.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;letter-spacing:-.03em;
}
.arr-eta{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.arr-eta.soon{color:var(--postech-red)}
.arr-eta.due{font-size:13.5px;white-space:nowrap}
.arr-eta.far{color:var(--muted);font-weight:800}
.side{font-size:12.5px;font-weight:800;color:var(--muted)}
.arr-at{color:var(--muted);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.arr-next{color:var(--muted);font-size:13px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
/* .arr > * 보다 구체적이어야 flex 를 덮어쓴다 — 이 줄에서 줄어드는 것은
   방면 이름뿐이고, 나머지는 제 너비를 지킨다 */
.arr > .arr-toward{
  margin-left:auto;font-size:13px;font-weight:800;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%;
  flex:0 1 auto;min-width:0;
}
.empty{color:var(--muted);font-size:14.5px;padding:10px 2px;font-weight:600}

.source .stale{color:#7a5a00;font-weight:800}
.source{
  margin:18px 0 0;text-align:center;font-size:12.5px;font-weight:700;
  color:var(--muted);font-variant-numeric:tabular-nums;
}
.panel-links{
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  margin:16px 0 4px;font-size:14.5px;font-weight:800;color:var(--muted);
}
.panel-links button,.panel-links a{
  border:0;background:none;color:var(--muted);text-decoration:underline;
  text-underline-offset:3px;padding:6px 2px;font-size:14.5px;font-weight:800;
}
.panel-links button:hover,.panel-links a:hover{color:var(--postech-red)}

/* 전체 시간표 표 */
.tt-head{display:flex;align-items:center;gap:8px;text-transform:none;font-size:15px;color:var(--ink);margin-top:22px}
.tt-head .badge{font-size:12px}
.view-head{display:flex;align-items:center;gap:8px;text-transform:none;font-size:15px;color:var(--ink)}
.back{border:0;background:none;font-size:19px;font-weight:900;color:var(--ink);padding:2px 6px;line-height:1}
.tt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px}
.tt{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tt th,.tt td{padding:8px 11px;white-space:nowrap;text-align:center}
.tt th{
  position:sticky;top:0;background:#fff;font-weight:900;font-size:13px;
  border-bottom:1px solid var(--line);letter-spacing:-.03em;
}
.tt td{border-bottom:1px solid #F1F3F6;font-weight:700;color:var(--ink)}
.tt tr:last-child td{border-bottom:0}
.tt tr.past td{color:#B9BFC8;font-weight:600}
.tt tr.next td{background:var(--postech-red-050);color:var(--postech-red-700);font-weight:900}
.panel-links button{cursor:pointer}

/* 설치 권유. 목록 안에 두었더니 시트가 접힌 기본 상태에서 화면 밖이라
   보이지 않았다. 지도 위쪽에 띄우고, 한 번 물러나면 다시 나오지 않는다. */
.install-bar{
  position:fixed;z-index:860;display:flex;align-items:center;gap:8px;
  left:max(12px, env(safe-area-inset-left));
  right:calc(max(12px, env(safe-area-inset-right)) + 58px);
  top:calc(var(--header-h) + 12px + env(safe-area-inset-top));
  padding:9px 10px 9px 12px;border-radius:14px;
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:13.5px;font-weight:800;color:var(--ink);
}
.install-bar[hidden]{display:none}
.install-icon{
  flex:0 0 auto;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
  background:var(--postech-red-050);color:var(--postech-red);font-size:14px;font-weight:900;
}
.install-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.install-yes{
  margin-left:auto;flex:0 0 auto;border:0;border-radius:9px;padding:6px 11px;
  background:var(--postech-red);color:#fff;font-size:12.5px;font-weight:900;
}
.install-x{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:13px;padding:5px 2px}
@media (min-width:821px){
  .install-bar{left:calc(var(--panel-w) + 12px);top:calc(var(--header-h) + 12px)}
}

/* ---------- notice ---------- */
.notice{
  margin:12px 0 0;display:flex;gap:9px;padding:11px 12px;border-radius:13px;
  border:1px solid #E8B4C7;background:var(--postech-red-050);color:var(--postech-red-700);
  font-size:14px;font-weight:700;line-height:1.5;
}
.notice.warn{border-color:#E7D2A0;background:#FFF9EC;color:#7a5a00}
.notice b{font-weight:900}

/* ---------- map markers ---------- */
/* 정류장 점은 15px 이라 손가락으로 겨냥하기 어렵다(권장 최소는 44px).
   보이는 크기는 그대로 두고 누를 수 있는 자리만 넓힌다.
   34px 인 이유: 18m 떨어진 '건너' 짝은 배율 17 에서 갈라지는데, 그보다
   크게 잡으면 두 점의 한가운데를 넘어 서로의 점까지 잡아먹는다. */
/* position 을 건드리면 안 된다 — MapLibre 가 마커에 position:absolute 를
   걸어 두는데, 여기서 relative 로 덮으면 마커가 문서 흐름으로 돌아가
   세로로 쌓인다. 그러면 transform 이 그 쌓인 자리에서부터 걸려, 뒤에
   그려진 정류장일수록 남쪽으로 밀린다(마커마다 14px 씩). 상자를 잡아 주는
   일은 이미 absolute 가 하고 있으니 아무것도 안 해도 된다. */
.stop-icon::after{
  content:'';position:absolute;left:50%;top:50%;
  width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
}
/* 갈라지기 시작하는 배율에서는 둘이 15px 밖에 안 떨어져 있어 더 좁힌다 */
#map.tight .stop-icon::after{width:22px;height:22px;margin:-11px 0 0 -11px}
.stop-marker{
  width:15px;height:15px;border-radius:50%;background:#fff;border:3.5px solid #333A45;
  box-shadow:0 1px 3px rgba(0,0,0,.28),0 0 0 1.5px rgba(255,255,255,.9);
}
#map.labels-off .stop-label{display:none}
/* 고른 정류장의 이름표는 감춘다. 이름은 바로 아래 시트 카드 첫 줄에 크게
   적혀 있고, 그 자리에는 출발·도착 표지가 뜬다 — 같은 말이 셋이 되고
   표지와 서로 밀친다. 고른 것은 붉은 테두리가 말해 준다. */
.gl-marker.sel .stop-label{display:none}
.stop-label{
  position:absolute;left:20px;top:-4px;white-space:nowrap;font-size:13px;font-weight:900;
  color:#1E232B;padding:1px 4px;border-radius:5px;letter-spacing:-.03em;pointer-events:none;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;
}
.gl-marker.sel .stop-marker{
  border-color:var(--postech-red);width:21px;height:21px;margin:-3px 0 0 -3px;
  box-shadow:0 0 0 5px rgba(166,25,85,.22),0 1px 5px rgba(0,0,0,.35);
}
.arrow-icon{width:0!important;height:0!important;overflow:visible}
/* 지도 위 진행 방향 화살표. 요약 줄의 화살표와 이름이 겹치지 않게 한정한다. */
.arrow-icon .arrow{
  position:absolute;left:0;top:0;font-size:19px;line-height:1;
  -webkit-text-stroke:2.5px #fff;paint-order:stroke fill;
  text-shadow:0 0 4px rgba(255,255,255,.9);
}
.bus-icon{width:0!important;height:0!important;overflow:visible}
.bus-icon .bus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

/* 지도 위를 다니는 버스. 번호만으로는 무엇인지 알기 어려워 형태를 준다. */
/* 그림자를 .bus 에 필터로 걸면 안 된다 — 필터는 그 박스 밖으로 삐져나온
   자식을 잘라내서, 버스 위에 얹은 방향 화살표가 사라진다. 조각마다 준다. */
.bus{position:relative}
.bus-body{
  display:flex;align-items:flex-end;justify-content:center;
  min-width:30px;padding:9px 7px 4px;border-radius:9px 9px 4px 4px;
  border:2px solid #fff;background:var(--c);
  color:#fff;font-size:12px;font-weight:900;line-height:1;
  letter-spacing:-.04em;white-space:nowrap;
  box-shadow:0 2px 4px rgba(0,0,0,.35);
}
/* 향한 쪽. 선 위에 화살표를 뿌리는 것보다 버스가 달고 다니는 편이 읽힌다 —
   어차피 알고 싶은 것은 "이 차가 어디로 가나" 하나다. */
/* z-index 가 필요하다. 자리 잡힌 형제들은 DOM 차례대로 겹치는데 화살표가
   맨 앞에 있어서 뒤에 오는 바퀴에 덮였다. */
.bus-dir{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}
/* 흰 테두리는 삼각형 두 장을 겹쳐 만든다 — CSS 삼각형에는 테두리를 줄 수
   없다. 버스 몸통도 흰 테두리를 두르고 있어 같은 옷을 입는 셈이다. */
.bus-dir::before, .bus-dir::after{content:'';position:absolute}
.bus-dir::before{                            /* 뒤에 깔리는 흰 삼각형 */
  left:-9.5px;top:-36px;
  border-left:9.5px solid transparent;border-right:9.5px solid transparent;
  border-bottom:13.5px solid #fff;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.32));
}
.bus-dir::after{                             /* 앞의 노선 색 삼각형 */
  left:-7px;top:-33.5px;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-bottom:10px solid var(--c);
}
.bus-dir[hidden]{display:none}
.bus-win{                                   /* 앞유리 */
  position:absolute;left:5px;right:5px;top:5px;height:6px;
  border-radius:3px;background:rgba(255,255,255,.85);
}
.bus .wheel{
  position:absolute;bottom:-3px;left:5px;width:7px;height:7px;border-radius:50%;
  background:#2F3540;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.bus .wheel.r{left:auto;right:5px}
/* 출발을 기다리는 차 — 속을 비워 아직 움직이지 않는다는 것을 보인다.
   자리는 이제 마커 자체가 아래 끝으로 잡혀 있어 따로 띄울 필요가 없다. */
.bus.waiting .bus-body{background:#fff;color:var(--c);border-color:var(--c)}
.bus.waiting .bus-win{background:var(--c);opacity:.22}
.bus.waiting .wheel{background:var(--c);border-color:#fff}

/* 내 위치. 점만 있으면 노선 색 사이에 묻혀서, 지도 앱들처럼 파란 번짐을
   둘러 둔다. 정확도 원(반지름이 실제 오차)과는 다른 것이다 — 이건 눈에
   띄라고 두는 장식이다. */
.me-wrap{position:relative;width:16px;height:16px}
.me{
  position:absolute;inset:0;width:16px;height:16px;border-radius:50%;
  background:#1a73e8;border:3px solid #fff;
  box-shadow:0 0 0 2px rgba(26,115,232,.35),0 2px 6px rgba(0,0,0,.3);
}
/* GPS 로 잡고 있는 동안의 표시 — 사방으로 옅게 번진다. 계속 뛰게 두면
   가만히 있는 지도에서 자꾸 눈이 끌린다. 조용히 켜 두기만 한다. */
.me-glow{
  position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(26,115,232,.28) 0%,rgba(26,115,232,.11) 48%,rgba(26,115,232,0) 72%);
}
/* 새로 잡았을 때·버튼을 눌렀을 때 한 번만 퍼진다 — 방금 잡았다는 신호다 */
.me-ping{
  position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
  border-radius:50%;border:2px solid rgba(26,115,232,.8);opacity:0;pointer-events:none;
}
.me-ping.go{animation:mePing .8s cubic-bezier(.2,.7,.3,1)}
@keyframes mePing{
  from{transform:scale(1);opacity:.85}
  to{transform:scale(5.5);opacity:0}
}
@media (prefers-reduced-motion:reduce){ .me-ping.go{animation:none} }
/* 폰이 향한 쪽. conic-gradient + mask 로 그렸더니 브라우저에 따라
   테두리만 남았다 — 모양이 계산으로 정해지도록 SVG 로 직접 그린다. */
.me-beam{
  position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;
  display:none;pointer-events:none;
}
.me-wrap.heading .me-beam{display:block}
.maplibregl-map{font-family:inherit}
/* 마커는 아이콘 크기만 차지한다 */
.gl-marker{line-height:0}
/* ?debug 전용 십자 — 아무 꾸밈 없이 좌표 그 자리만 가리킨다 */
.dbg-cross i,.dbg-cross b{position:absolute;background:#FF1744}
.dbg-cross i{left:0;top:10px;width:21px;height:1px}
.dbg-cross b{left:10px;top:0;width:1px;height:21px}
/* 버스는 쉬지 않고 조금씩 움직인다. 그냥 두면 브라우저가 정수 픽셀에 맞춰
   그려서, x 와 y 가 경계를 넘는 시점이 달라 대각선이 계단처럼 꺾인다.
   따로 합성 층으로 올리면 GPU 가 소수점째로 옮겨 준다. */
.gl-marker.bus-icon{will-change:transform;backface-visibility:hidden}


/* 지도에서 출발·도착 지정 */
.maplibregl-popup{z-index:820}
.pa-popup .maplibregl-popup-content{border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.22);margin:0;padding:11px 13px;font:inherit}

/* 고른 자리에 세우는 물방울 핀 — 뾰족한 끝이 실제 지점이다 */
.pick-pin{
  width:22px;height:22px;margin:1px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);border:2.5px solid #fff;
  background:var(--postech-red);box-shadow:0 2px 7px rgba(0,0,0,.4);
}

.pa{display:flex;align-items:center;gap:7px}
/* 시트 카드 안에 놓일 때 — 지도 위 표지가 아니라 카드의 한 줄이다 */
.pa.card{padding:2px 0 12px;gap:8px}
.pa.card button{flex:1 1 0;padding:12px 10px;font-size:15.5px}
.pa button{
  border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:8px 12px;font-size:15px;font-weight:900;color:#444B57;
  /* 영문("From here")이 두 줄로 접히던 자리 */
  white-space:nowrap;
}
/* 길찾기 딱지·지도 핀과 같은 색을 쓴다 — 같은 뜻이니 같은 색이어야 한다 */
.pa button[data-w="from"]{border-color:#1a8a4a;color:#14713d}
.pa button[data-w="to"]{border-color:var(--postech-red);color:var(--postech-red)}
.pa button[data-w="from"]:hover{background:#1a8a4a;color:#fff}
.pa button[data-w="to"]:hover{background:var(--postech-red);color:#fff}

/* 내 위치 직접 지정 */
/* 고를 자리를 가리키는 붙박이 핀. 지도의 '보이는 가운데'에 선다 —
   위(길찾기 입력칸)와 아래(시트·탭)에 가려지는 만큼을 뺀 한가운데다.
   물방울 끝이 실제로 고르는 점이므로 그만큼 위로 올려 놓는다. */
.pick-cursor{
  position:fixed;left:50%;z-index:895;pointer-events:none;
  top:calc((var(--pick-top, 0px) + 100dvh - var(--sheet) - var(--tabs-h) - var(--kb)) / 2);
}
.pick-cursor[hidden]{display:none}
/* 물방울 꼭짓점(아래에서 2px 위)이 고르는 점이다 */
.pick-cursor{transform:translate(-50%, calc(-100% + 2px))}
.pick-cursor .trip-pin{filter:drop-shadow(0 3px 9px rgba(0,0,0,.45))}
.trip-pin.me{--pc:#1a73e8}
@media (min-width:821px){ .pick-cursor{left:calc(50% + var(--panel-w) / 2)} }

.pick-hint{
  position:fixed;z-index:900;
  left:max(12px, env(safe-area-inset-left));right:max(12px, env(safe-area-inset-right));
  bottom:calc(var(--sheet) + var(--tabs-h) + var(--kb) + 16px);
  background:#1a73e8;color:#fff;border-radius:14px;box-shadow:var(--shadow);
  padding:12px 14px;display:flex;align-items:center;gap:10px;
  font-size:14px;font-weight:800;
}
.pick-hint .ok{background:#fff;color:#1a73e8}
.pick-hint[hidden]{display:none}
.pick-hint span{margin-right:auto;min-width:0}
.pick-hint button{
  margin-left:6px;border:0;background:rgba(255,255,255,.2);color:#fff;
  border-radius:9px;padding:7px 12px;font-size:13px;font-weight:800;
}
.pick-hint.update{background:#333A45;bottom:auto;top:calc(var(--header-h) + 12px + env(safe-area-inset-top))}

@media (min-width:821px){ .pick-hint{left:calc(var(--panel-w) + 12px);right:74px;bottom:26px} }

/* ---------- 위치 권한 안내 ---------- */
.ask{
  position:fixed;inset:var(--header-h) 0 0 0;z-index:1100;
  background:rgba(20,22,26,.42);display:grid;place-items:center;padding:18px;
}
.ask[hidden]{display:none}   /* display 선언이 hidden 속성을 덮으므로 명시한다 */
.ask-card{
  width:min(360px,100%);background:#fff;border-radius:20px;padding:20px 20px 16px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center;
}
/* 글리프(◎) 대신 지도 위 ◎ 버튼과 같은 아이콘을 쓴다 — 같은 뜻이고,
   글리프는 글꼴에 따라 모양이 제각각이다. */
.ask-icon{
  width:46px;height:46px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  background:var(--postech-red-050);color:var(--postech-red);
}
.ask-icon svg{
  width:24px;height:24px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.ask-card strong{display:block;font-size:18px;letter-spacing:-.03em;margin-bottom:7px}
.ask-card p{margin:0 0 16px;font-size:15px;line-height:1.6;color:var(--muted);font-weight:600}
.ask-card p b{color:var(--ink)}
.ask-actions{display:flex;gap:8px}
.ask-actions button{
  flex:1;border-radius:12px;padding:13px 10px;font-size:15.5px;font-weight:900;border:1px solid var(--line);
}
.ask-no{background:#fff;color:#69717d}
.ask-no:hover{background:var(--soft)}
.ask-yes{background:var(--postech-red);border-color:var(--postech-red);color:#fff}
.ask-yes:hover{background:var(--postech-red-700)}
.ask-steps{text-align:left;margin:0 0 16px;padding-left:18px;font-size:15px;line-height:1.7;color:var(--muted);font-weight:700}
.ask-steps li+li{margin-top:2px}

/* 지도 위 떠 있는 것들.
   모바일에는 상단바가 없다 — 시각은 폰 상태바에 있고, 확대·축소는 지도 앱에서
   보통 두지 않는다. 위에 레이어, 아래 왼쪽에 길찾기, 아래 오른쪽에 내 위치. */
.map-top{
  position:fixed;z-index:850;display:flex;flex-direction:column;gap:9px;
  right:max(12px, env(safe-area-inset-right));
  top:calc(var(--header-h) + 12px + env(safe-area-inset-top));
}
@media (min-width:821px){
  #btnRoute{display:none}
  .map-top{top:calc(var(--header-h) + 12px)}
}

/* ---------- floating map buttons ---------- */
.mapbtns{
  position:fixed;z-index:850;display:flex;flex-direction:column;gap:9px;
  right:max(12px, env(safe-area-inset-right));
  /* 시트·탭 바로 위에 붙으면 길찾기 버튼이 눌리기 답답하다 */
  bottom:calc(var(--sheet) + var(--kb) + var(--tabs-h) + 22px);
  transition:bottom .26s cubic-bezier(.22,.7,.3,1);
}
/* 지도 위에서 엄지로 누르는 버튼이라 넉넉해야 한다 (권장 최소가 44px 인데
   그 자리에 딱 맞춰 두면 지도를 끌다가 스치기 쉽다) */
.mapbtn{
  width:54px;height:54px;border-radius:17px;border:1px solid var(--line);background:#fff;
  box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;line-height:1;
  color:#3d434c;padding:0;
}
.mapbtn svg{
  width:27px;height:27px;fill:none;stroke:currentColor;
  stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;
}
.mapbtn[hidden]{display:none}

/* 경로 카드가 아래를 차지하면 시트는 물러난다 */
.mapbtns.left{left:max(12px, env(safe-area-inset-left));right:auto;align-items:flex-start}
#whenBtns{position:fixed}
.mapbtns.left[hidden]{display:none}
/* 시각을 바꿔 두면 아이콘만으로는 알 수 없다. 설정한 시각을 배지로 붙인다. */
/* 늘 붙어 있는 배지. 평소에는 "지금" 이라 무엇을 다루는 버튼인지 말해 주고,
   시각을 정해 두면 그 시각이 붉게 뜬다 — 기본이 아니라는 표시다. */
.clock-tag{
  position:absolute;left:50%;transform:translateX(-50%);bottom:-7px;
  background:#8A9099;color:#fff;border-radius:7px;padding:1px 5px;
  font-size:11px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  white-space:nowrap;
}
.clock-tag.set{background:var(--postech-red)}
.clock-tag[hidden]{display:none}
/* 지도 위 출발·도착.

   글자를 물방울 안에 넣으려면 그만큼 커야 한다. 돌린 사각형으로 물방울을
   만들면 글자까지 돌아가 다시 되돌려야 하므로, 동그라미에 아래로 삼각 꼬리를
   붙여 만든다 — 글자는 그냥 가운데 선다. 꼬리 끝이 실제 지점이다.

   글자를 넣는 이유: 지도 위에서는 자리로 구별할 수가 없어 색만 남는데,
   색 하나에 뜻을 다 싣지 않는다. */
.end-icon{overflow:visible}
.trip-pin{
  --pc:#1a8a4a;
  position:relative;width:46px;height:55px;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.4));
}
.trip-pin svg{display:block;width:46px;height:55px}
/* 원과 꼭짓점이 접선으로 이어지는 진짜 물방울. 삼각형을 이어 붙이면 이음매가
   보인다 — 반지름 19, 꼭짓점 (0,30), 접점 (±14.7, 12.03) 에서 매끄럽게 만난다. */
.trip-pin path{fill:var(--pc);stroke:#fff;stroke-width:3;stroke-linejoin:round}
.trip-pin span{
  position:absolute;left:0;right:0;top:0;height:46px;
  display:grid;place-items:center;
  color:#fff;font-size:12.5px;font-weight:900;letter-spacing:-.04em;line-height:1;
}
.trip-pin.to{--pc:var(--postech-red)}
/* 승하차 지점은 노선 색 테두리를 인라인으로 받는다 */

.trip-stop{
  width:16px;height:16px;border-radius:50%;background:#fff;
  border:4px solid #888;box-shadow:0 1px 4px rgba(0,0,0,.35);
}
/* 길찾기 폼이 상단을 차지하면 설치 안내는 물러난다 */
body.trip-top-on .install-bar{display:none}
/* 길찾기 중에는 위에 입력칸, 아래에 경로 카드다. 탭까지 두면 너무 복잡하다.
   대신 상단바 왼쪽에 나가는 화살표를 둔다 — 없으면 빠져나올 길이 없다. */
body.trip-top-on .tabs{display:none}
body.trip-top-on{--tabs-h:0px}
/* 출발·도착을 찍는 동안 시트에는 아무것도 없다. 빈 흰 띠가 지도를 가릴
   이유가 없으므로 아예 내린다. 결과가 나오면 가로 카드 띠가 그 자리를 쓴다. */
/* 길찾기 중 시트는 결과 목록 자리다. 아직 결과가 없을 때만 내린다 —
   빈 흰 띠가 지도를 가릴 이유는 없지만, 결과가 나오면 그 자리가 필요하다. */
body.trip-top-on.trip-empty .panel{display:none}
.trip-main{display:flex;align-items:center;gap:8px}
.trip-rows{flex:1 1 auto;min-width:0}
.trip-swap{align-self:center}
.trip-close{
  flex:0 0 auto;width:32px;height:32px;padding:0;align-self:center;
  border:0;background:none;color:#69717d;display:none;place-items:center;cursor:pointer;
}
.trip-close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.trip-close:hover{color:var(--postech-red)}
/* 사이드바 안에서는 닫을 이유가 없다 — 늘 펴 두는 자리다 */
.trip-top .trip-close{display:grid}
#btnClock{position:relative;overflow:visible}
/* 시각 입력은 눈에 보이지 않게 두고, 시계 버튼이 대신 연다.
   화면 밖으로 치우면 브라우저가 고르는 창을 엉뚱한 데 띄우므로 버튼 뒤에 겹쳐 둔다. */
#whenTime{
  position:absolute;left:0;bottom:0;width:100%;height:100%;
  opacity:0;pointer-events:none;border:0;padding:0;
}
/* 시각을 정해 둔 상태에서만 나오는 되돌리기. 시계 버튼 위에 작게 붙는다. */
.when-clear{width:38px;height:38px;border-radius:50%}
.when-clear svg{width:19px;height:19px;stroke-width:2.2}
/* 확대·축소는 지도 앱 관행대로 한 덩어리로 붙인다 */
.zoomer{
  display:flex;flex-direction:column;border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);
}
.zoomer .mapbtn{
  border-radius:0;box-shadow:none;height:50px;
}
.zoomer .mapbtn+.mapbtn{border-top:0}
@media (min-width:821px){
  .mapbtns{bottom:26px;transition:none}
  .mapbtns.left{left:calc(var(--panel-w) + 14px)}
}
body.sheet-full .mapbtns{opacity:0;pointer-events:none;transition:opacity .15s}
.mapbtn.on{background:var(--postech-red);border-color:var(--postech-red);color:#fff}
/* 내 위치는 자주 눌러 상태가 오가는 버튼이라, 통째로 색이 바뀌면 지도 위에서
   너무 튄다. 바탕은 흰색 그대로 두고 안쪽 아이콘만 바꾼다.
   따라가는 중 = 파란 조준점, 방향까지 = 파란 화살표. */
/* 내 위치만 동그랗게 — 지도 앱들이 쓰는 모양이고, 네모난 버튼 사이에서
   무엇을 하는 것인지 모양만으로 구별된다 */
.locbtn{border-radius:50%}
.locbtn.on,
.locbtn.heading{background:#fff;border-color:var(--line)}
.locbtn.on{color:#1a73e8}
.locbtn.heading{color:#1a73e8}
.locbtn .ic-nav{display:none}
.locbtn.heading .ic-crosshair{display:none}
.locbtn.heading .ic-nav{display:block}
/* 방향까지 따라가는 중 — 한 번 더 누른 상태 */
.mapbtn.heading{color:#1a73e8}
/* 나침반. 바늘이 늘 북쪽을 가리키므로 지도가 돌아간 만큼 같이 돈다.
   북쪽 반쪽만 빨갛다 — 나침반은 다들 그렇게 생겼고, 어느 쪽이 북인지
   방향(위아래)이 아니라 색으로 알 수 있어야 돌아가 있어도 읽힌다. */
#btnNorth svg{transition:transform .1s linear}
#btnNorth .n{fill:var(--postech-red);stroke:none}
#btnNorth .s{fill:#B9BEC6;stroke:none}
@media (prefers-reduced-motion:reduce){ #btnNorth svg{transition:none} }
/* 길찾기는 이 화면의 주된 동작이라 채워서 눈에 띄게 둔다 */
.mapbtn.primary{
  background:var(--postech-red);border-color:var(--postech-red);color:#fff;
  box-shadow:0 4px 14px rgba(166,25,85,.34);
}
.mapbtn.primary:hover{background:var(--postech-red-700)}
.mapbtn.primary.on{background:#333A45;border-color:#333A45;box-shadow:var(--shadow)}
.mapbtn:disabled{color:#C6CBD3;cursor:default}

/* ---------- edit mode ---------- */
.editbar{
  position:fixed;left:12px;right:12px;top:calc(var(--header-h) + 12px + env(safe-area-inset-top));z-index:850;background:#FFF9EC;
  border:1px solid #E7D2A0;border-radius:14px;box-shadow:var(--shadow);padding:10px 13px;
  display:none;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:14.5px;font-weight:800;color:#7a5a00;
}
.editbar.show{display:flex}
.editbar>span{flex:1 1 auto;min-width:0}
@media (min-width:821px){
  /* 지도가 패널 오른쪽에서 시작하므로 편집 바도 그 안쪽에 둔다 */
  .editbar{left:calc(var(--panel-w) + 12px);right:74px}
}
.editbar button{
  border:1px solid #E7D2A0;background:#fff;border-radius:9px;padding:6px 11px;
  font-size:14px;font-weight:800;color:#7a5a00;
}

/* ---------- 좁은 화면 미세 조정 ---------- */
@media (max-width:820px){
  /* 상단바 없이 지도가 화면을 가득 채운다 */
  :root{--header-h:0px}
  .hdr{display:none}
  .desk{display:none!important}
}
@media (max-width:520px){
  .brand-long{display:none}
  .hdr .sub{display:none}
  .hdr strong{font-size:17px}
  .hdr-btn.desk,.mapbtn.desk{display:none}
  .clock{font-size:16.5px;padding:7px 11px}
  .hdr-btn{padding:9px 13px;font-size:15px}
  .stop{padding:13px 14px}
  .stop-name{font-size:16.5px}
  .arr{font-size:15px}
  .badge{min-width:28px;height:24px}
  /* 16px 미만이면 iOS 가 입력할 때 화면을 확대해 버린다 */
  .trip input{padding:7px 11px;font-size:16.5px}
  .mini{width:38px;height:38px}
  .itin-dur{font-size:22px}
  .leg{font-size:15px;padding:5px 0}
}
@media (max-width:380px){
  .hdr strong{font-size:15.5px}
  .hdr-btn{padding:8px 10px;font-size:15px}
  .clock{font-size:15.5px;padding:6px 8px}
}
/* 움직임을 줄여 달라는 설정에서는 우리 UI 의 장식적 움직임만 끈다.
   전체 선택자로 끄면 트랜지션이 없던 요소(지도 pane 등)에까지 0.01ms
   트랜지션이 붙어, 드래그로 지도를 옮길 때 오히려 뚝뚝 끊긴다.
   지도 이동은 손가락을 따라가는 직접 조작이라 줄일 대상이 아니다. */
@media (prefers-reduced-motion:reduce){
  .panel,.mapbtns,.pick-hint,.simbar{transition:none!important}
  .clock .colon{animation:none}
}
</style>
</head>
<body>

<a class="skip" id="skipLink" href="#panelScroll">본문으로 건너뛰기</a>
<header class="hdr">
  <div class="brand">
    <strong><span id="brandShort">POSTECH 셔틀</span><span class="brand-long" id="brandLong"> 버스 지도</span></strong>
    <span class="sub" id="tagline">시간표 기반 운행 위치 · 실시간 GPS 아님</span>
  </div>
  <div class="spacer"></div>
  <div class="clock" id="clock" role="timer" aria-atomic="true"><span id="clockH">--</span><span class="colon" aria-hidden="true">:</span><span id="clockM">--</span></div>
  <button class="hdr-btn desk" id="lnkTimetable">시간표</button>
</header>

<aside class="panel" id="panel" aria-label="정류장과 길찾기">
  <button class="grab" id="grab" aria-expanded="false" aria-controls="panelScroll"><span aria-hidden="true"></span></button>
  <button class="hero" id="hero" aria-live="polite" aria-atomic="true"></button>
  <div class="trip" id="trip">
    <div class="trip-summary" id="tripSummary" hidden></div>
    <div class="trip-fields" id="tripFields">
      <!-- 바꾸기는 두 줄에 함께 걸리는 동작이라 왼쪽에 한 번만 둔다.
           닫기는 오른쪽 맨 끝 — 나가는 문은 늘 같은 자리에 있어야 한다. -->
      <div class="trip-main">
        <button class="mini trip-swap" id="btnSwap" title="출발·도착 바꾸기" aria-label="출발·도착 바꾸기">⇅</button>
        <div class="trip-rows">
          <div class="trip-row">
            <span class="pin from" id="pinFrom" role="img" aria-label="출발"></span>
            <input id="inFrom" placeholder="출발지" autocomplete="off" aria-label="출발지">
          </div>
          <div class="trip-row">
            <span class="pin to" id="pinTo" role="img" aria-label="도착"></span>
            <input id="inTo" placeholder="도착지" autocomplete="off" aria-label="도착지">
          </div>
        </div>
        <button class="trip-close" id="tripClose" aria-label="길찾기 닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></svg>
        </button>
      </div>
      <div class="suggest" id="suggest" role="listbox" aria-label="검색 결과"></div>
    </div>
  </div>
  <div class="filters" id="filters" role="group" aria-label="노선 선택"></div>
  <div class="panel-scroll" id="panelScroll" tabindex="-1"></div>
</aside>

<!-- 모바일에서는 길찾기 폼을 화면 위에 고정한다. 지도 앱들의 방식이고,

<script>
/* 오프라인 지원. 시간표·노선·보행 그래프가 전부 정적 파일이라
   지도 타일만 받아 두면 통째로 오프라인으로 동작한다. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      const show = w => {
        const el = document.getElementById('updateHint');
        el.hidden = false;
        document.getElementById('updateNow').onclick = () => {
          w.postMessage('skipWaiting');
          location.reload();
        };
      };
      if (reg.waiting) show(reg.waiting);
      /* 새 버전이 있는지 다시 물어본다. 등록할 때 한 번만 보면, 화면을
         오래 켜 둔 채로는 새 코드가 나와도 모른 채 옛것을 계속 쓴다. */
      const check = () => reg.update().catch(() => {});
      setInterval(check, 30 * 60 * 1000);
      addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w?.addEventListener('statechange', () => {
          // 이미 쓰고 있는 중에 새 버전이 준비된 경우만 알린다
          if (w.state === 'installed' && navigator.serviceWorker.controller) show(w);
        });
      });
    } catch (e) { /* 오프라인 지원 없이도 그대로 동작한다 */ }
  });
}
</script>
