<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포스텍 셔틀버스 — 화면</title>
<meta name="robots" content="noindex">
<link rel="icon" href="./icon-192.png">
<style>
:root{ --ink:#1E232B; --muted:#69717d; --line:#E3E6EB; --red:#A61955; }
*{box-sizing:border-box}
body{
  margin:0;background:#fff;color:var(--ink);padding:38px 22px 60px;
  font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.6;letter-spacing:-.015em;word-break:keep-all;
}
h1{margin:0 0 26px;font-size:24px;font-weight:900;letter-spacing:-.04em}
ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:30px 26px}
li{display:flex;gap:16px;align-items:flex-start}
img{border:1px solid var(--line);border-radius:16px;display:block}
.meta{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-top:4px}
.meta b{font-size:16px;font-weight:900;letter-spacing:-.03em}
.meta span{font-size:13.5px;color:var(--muted)}
.meta a{
  margin-top:9px;background:var(--red);color:#fff;text-decoration:none;
  padding:8px 15px;border-radius:10px;font-size:14px;font-weight:900;white-space:nowrap;
}
.meta a:hover{background:#900048}
.meta a.sub{margin-top:6px;background:#fff;color:var(--muted);border:1px solid var(--line);font-weight:800}
.meta a.sub:hover{background:#F6F7F9;color:var(--ink)}
footer{margin-top:40px;color:var(--muted);font-size:13.5px}
footer a{color:var(--red);font-weight:800;text-decoration:none}
</style>
