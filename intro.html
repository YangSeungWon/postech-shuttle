<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포스텍 셔틀버스</title>
<meta name="description" content="포스텍 교내 셔틀버스를 지도에서 봅니다.">
<link rel="icon" href="./icon-192.png">
<style>
:root{ --ink:#1E232B; --muted:#69717d; --line:#E3E6EB; --soft:#F6F7F9; --red:#A61955; --w:236px; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#fff;color:var(--ink);text-align:center;
  font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.6;letter-spacing:-.015em;word-break:keep-all;
}

header{padding:46px 22px 26px}
h1{margin:0 0 16px;font-size:28px;font-weight:900;letter-spacing:-.04em}
.open{
  display:inline-block;background:var(--red);color:#fff;text-decoration:none;
  padding:11px 26px;border-radius:12px;font-weight:900;font-size:16px;line-height:1.2;
}
.open:hover{background:#900048}

/* 보고 있는 것을 가운데 두고, 양옆이 슬그머니 보이게. */
.deck{
  display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding-inline:calc(50% - var(--w) / 2);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.deck::-webkit-scrollbar{display:none}
.card{
  flex:0 0 var(--w);scroll-snap-align:center;
  opacity:.35;transition:opacity .45s ease;
}
.card.on{opacity:1}
/* 자막은 그대로 두고 화면만 줄여야 줄이 맞는다 */
.card video{transform:scale(.9);transition:transform .45s ease}
.card.on video{transform:none}
video{
  display:block;width:100%;border-radius:18px;
  border:1px solid var(--line);background:var(--soft);
}
.card h2{
  margin:12px 0 0;font-size:16px;font-weight:900;letter-spacing:-.03em;
  white-space:nowrap;
}

.dots{display:flex;justify-content:center;gap:7px;padding:20px 0 0}
.dots b{
  width:7px;height:7px;border-radius:50%;background:var(--line);
  transition:background .3s ease;cursor:pointer;
}
.dots b.on{background:var(--red)}

footer{color:var(--muted);font-size:13.5px;padding:26px 22px 44px}
footer p{margin:0 0 5px}
footer a{color:var(--red);font-weight:800;text-decoration:none}

@media (prefers-reduced-motion:reduce){ .card,.card video{transition:none} }
</style>

<header>
  <h1>포스텍 셔틀버스</h1>
  <a class="open" href="./">열기</a>
</header>

<div class="deck" id="deck">
  <div class="card"><video src="./promo/midday.mp4" autoplay muted loop playsinline></video><h2>버스가 지금 어디쯤</h2></div>
  <div class="card"><video src="./promo/rush.mp4" autoplay muted loop playsinline></video><h2>노선별로</h2></div>
  <div class="card"><video src="./promo/stop.mp4" autoplay muted loop playsinline></video><h2>정류장을 누르면</h2></div>
  <div class="card"><video src="./promo/trip.mp4" autoplay muted loop playsinline></video><h2>길찾기</h2></div>
</div>
<div class="dots" id="dots"></div>

<footer>
  <p>버스 위치는 시간표에서 계산한 값입니다.</p>
  <p>2026년 8월 3일 시행 · 평일만 운행</p>
  <p><a href="./">bus.ysw.kr</a></p>
</footer>

<script>
(() => {
  const deck  = document.getElementById('deck');
  const cards = [...deck.children];
  const dots  = document.getElementById('dots');
  cards.forEach((_, i) => {
    const b = document.createElement('b');
    b.onclick = () => { hold(); go(i); };
    dots.append(b);
  });
  const marks = [...dots.children];

  let cur = 0;
  const mark = i => {
    if (i === cur) return;
    cur = i;
    cards.forEach((c, n) => c.classList.toggle('on', n === i));
    marks.forEach((m, n) => m.classList.toggle('on', n === i));
  };
  cards[0].classList.add('on');
  marks[0].classList.add('on');

  const go = i => deck.scrollTo({
    left: cards[i].offsetLeft - (deck.clientWidth - cards[i].clientWidth) / 2,
    behavior: 'smooth',
  });

  /* 가운데에 가장 가까운 것이 지금 보고 있는 것 */
  let tick;
  deck.addEventListener('scroll', () => {
    cancelAnimationFrame(tick);
    tick = requestAnimationFrame(() => {
      const mid = deck.scrollLeft + deck.clientWidth / 2;
      let best = 0, near = Infinity;
      cards.forEach((c, i) => {
        const d = Math.abs(c.offsetLeft + c.clientWidth / 2 - mid);
        if (d < near) { near = d; best = i; }
      });
      mark(best);
    });
  }, { passive: true });

  /* 끝에서 되돌아오며 천천히 넘어간다. 손대면 잠시 멈춘다. */
  const slow = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dir = 1, idle = 0, timer;
  const step = () => {
    if (idle > Date.now() || document.hidden) return;
    if (cur + dir >= cards.length || cur + dir < 0) dir = -dir;
    go(cur + dir);
  };
  const hold = () => { idle = Date.now() + 9000; };
  if (!slow) timer = setInterval(step, 4200);
  ['pointerdown', 'wheel', 'touchmove', 'keydown'].forEach(
    e => deck.addEventListener(e, hold, { passive: true }));
})();
</script>
